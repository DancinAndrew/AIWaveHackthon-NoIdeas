<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3000" height="1700" viewBox="0 0 3000 1700" role="img" aria-labelledby="title desc">
  <title id="title">AI 生活管家 AWS AgentCore 正式架構</title>
  <desc id="desc">以官方 AWS Architecture Icons 繪製的 us-west-2 staging 架構，顯示 Amplify、API Gateway、Flask Lambda、AgentCore Runtime、五個邏輯 Agent、RDS、Knowledge Base、S3 Vectors、Step Functions 與安全邊界。</desc>
  <defs>
