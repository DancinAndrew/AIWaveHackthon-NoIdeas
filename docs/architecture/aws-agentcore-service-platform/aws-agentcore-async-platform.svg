<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">AWS AgentCore 水電 Demo 架構</title>
  <desc id="desc">顯示已部署的 Amplify、API Gateway、Flask Lambda、AgentCore Runtime、RDS、Knowledge Base 與下一階段接線。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 34px Arial,"PingFang TC",sans-serif;fill:#0f172a}
      .subtitle{font:500 17px Arial,"PingFang TC",sans-serif;fill:#475569}
      .section{font:700 21px Arial,"PingFang TC",sans-serif;fill:#1e293b}
      .node-title{font:700 18px Arial,"PingFang TC",sans-serif;fill:#172033}
      .node-text{font:500 15px Arial,"PingFang TC",sans-serif;fill:#334155}
      .small{font:500 13px Arial,"PingFang TC",sans-serif;fill:#475569}
      .solid{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .label{font:600 13px Arial,"PingFang TC",sans-serif;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .section-box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:18}
      .actor{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2;rx:14}
      .edge{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;rx:14}
      .compute{fill:#e0e7ff;stroke:#4f46e5;stroke-width:2;rx:14}
      .agent{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:14}
      .data{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:14}
      .workflow{fill:#fce7f3;stroke:#db2777;stroke-width:2;rx:14}
      .security{fill:#f3f4f6;stroke:#4b5563;stroke-width:2;rx:14}
      .planned{opacity:.76}
    </style>
  </defs>

  <rect width="1800" height="1160" fill="#ffffff"/>
  <text x="50" y="52" class="title">AWS AgentCore 水電 Demo 架構｜us-west-2</text>
  <line x1="50" y1="82" x2="105" y2="82" class="solid"/>
  <text x="120" y="87" class="subtitle">已部署並由公開 E2E 驗證</text>
  <line x1="380" y1="82" x2="435" y2="82" class="dashed"/>
  <text x="450" y="87" class="subtitle">已建立但主流程待接，或下一階段</text>

  <rect x="35" y="120" width="220" height="360" class="section-box"/>
  <text x="55" y="154" class="section">使用者</text>
  <rect x="65" y="185" width="160" height="65" class="actor"/>
  <text x="145" y="224" text-anchor="middle" class="node-title">住戶</text>
  <rect x="65" y="280" width="160" height="65" class="actor"/>
  <text x="145" y="319" text-anchor="middle" class="node-title">廠商</text>
  <rect x="65" y="375" width="160" height="65" class="actor"/>
  <text x="145" y="414" text-anchor="middle" class="node-title">管理員</text>

  <rect x="285" y="120" width="405" height="360" class="section-box"/>
  <text x="305" y="154" class="section">公開入口</text>
  <rect x="325" y="180" width="325" height="90" class="edge"/>
  <text x="488" y="213" text-anchor="middle" class="node-title">React SPA on Amplify</text>
  <text x="488" y="240" text-anchor="middle" class="node-text">AI 對話／我的預約／廠商後台</text>
  <rect x="325" y="305" width="325" height="75" class="edge"/>
  <text x="488" y="337" text-anchor="middle" class="node-title">API Gateway HTTP API</text>
  <text x="488" y="360" text-anchor="middle" class="small">Amplify-only CORS＋demo actor headers</text>
  <g class="planned">
    <rect x="325" y="410" width="325" height="48" class="edge"/>
    <text x="488" y="440" text-anchor="middle" class="node-text">Cognito 三群組｜JWT UI 待接</text>
  </g>

  <rect x="720" y="145" width="220" height="88" class="data"/>
  <text x="830" y="179" text-anchor="middle" class="node-title">Private S3 KB</text>
  <text x="830" y="204" text-anchor="middle" class="node-text">5 docs＋5 metadata</text>
  <rect x="720" y="275" width="220" height="80" class="data"/>
  <text x="830" y="310" text-anchor="middle" class="node-title">Private Artifact S3</text>
  <text x="830" y="334" text-anchor="middle" class="small">需求文件獨立保存</text>

  <rect x="35" y="525" width="905" height="565" class="section-box"/>
  <text x="55" y="560" class="section">VPC｜2 AZ isolated subnets｜無 NAT</text>
  <rect x="75" y="605" width="250" height="90" class="compute"/>
  <text x="200" y="640" text-anchor="middle" class="node-title">Flask Lambda</text>
  <text x="200" y="665" text-anchor="middle" class="node-text">REST／授權／polling API</text>
  <rect x="380" y="605" width="250" height="90" class="compute"/>
  <text x="505" y="640" text-anchor="middle" class="node-title">AgentCore VPC Endpoint</text>
  <text x="505" y="665" text-anchor="middle" class="small">private Runtime invocation</text>
  <g class="planned">
    <rect x="685" y="605" width="215" height="90" class="compute"/>
    <text x="793" y="640" text-anchor="middle" class="node-title">Gateway Tool Lambda</text>
    <text x="793" y="665" text-anchor="middle" class="small">target 已建立；主流程待接</text>
  </g>
  <rect x="75" y="760" width="310" height="105" class="compute"/>
  <text x="230" y="797" text-anchor="middle" class="node-title">Shared Python Core</text>
  <text x="230" y="824" text-anchor="middle" class="node-text">安全 gate／多輪／媒合／冪等</text>
  <text x="230" y="848" text-anchor="middle" class="small">封裝於 Flask 與 Tool Lambda</text>
  <rect x="445" y="760" width="310" height="105" class="data"/>
  <text x="600" y="797" text-anchor="middle" class="node-title">Private RDS PostgreSQL</text>
  <text x="600" y="824" text-anchor="middle" class="node-text">requests／tasks／messages</text>
  <text x="600" y="848" text-anchor="middle" class="small">artifacts／events／progress</text>
  <rect x="75" y="930" width="310" height="95" class="security"/>
  <text x="230" y="966" text-anchor="middle" class="node-title">Secrets Manager＋KMS</text>
  <text x="230" y="992" text-anchor="middle" class="small">DB credential／RDS／S3 encryption</text>
  <rect x="445" y="930" width="310" height="95" class="security"/>
  <text x="600" y="966" text-anchor="middle" class="node-title">CloudWatch Logs</text>
  <text x="600" y="992" text-anchor="middle" class="small">request ID／Lambda errors</text>

  <rect x="980" y="120" width="785" height="970" class="section-box"/>
  <text x="1000" y="154" class="section">AWS managed AI／workflow services</text>
  <rect x="1020" y="180" width="705" height="400" class="agent"/>
  <text x="1045" y="215" class="section">一個 AgentCore Runtime</text>
  <rect x="1050" y="245" width="210" height="85" class="agent"/>
  <text x="1155" y="280" text-anchor="middle" class="node-title">Supervisor</text>
  <text x="1155" y="305" text-anchor="middle" class="small">確定性工具式路由</text>
  <rect x="1310" y="230" width="360" height="50" class="agent"/>
  <text x="1490" y="261" text-anchor="middle" class="node-text">餐廳 Agent 契約</text>
  <rect x="1310" y="293" width="360" height="50" class="agent"/>
  <text x="1490" y="324" text-anchor="middle" class="node-text">商品 Agent 契約</text>
  <rect x="1310" y="356" width="360" height="50" class="agent"/>
  <text x="1490" y="387" text-anchor="middle" class="node-text">家事 Agent 契約</text>
  <rect x="1310" y="419" width="360" height="58" class="agent"/>
  <text x="1490" y="446" text-anchor="middle" class="node-title">水電 Agent</text>
  <text x="1490" y="467" text-anchor="middle" class="small">walking skeleton 已完成</text>
  <rect x="1310" y="490" width="360" height="50" class="agent"/>
  <text x="1490" y="521" text-anchor="middle" class="node-text">社區 Agent 契約</text>

  <g class="planned">
    <rect x="1020" y="630" width="315" height="100" class="agent"/>
    <text x="1178" y="667" text-anchor="middle" class="node-title">AgentCore Gateway</text>
    <text x="1178" y="694" text-anchor="middle" class="node-text">Lambda target 已建立</text>
    <text x="1178" y="716" text-anchor="middle" class="small">Runtime tool call 待接</text>
  </g>
  <rect x="1380" y="630" width="305" height="100" class="workflow"/>
  <text x="1533" y="667" text-anchor="middle" class="node-title">Step Functions Standard</text>
  <text x="1533" y="694" text-anchor="middle" class="node-text">durable boundary 已建立</text>
  <text x="1533" y="716" text-anchor="middle" class="small">callback worker 待接</text>
  <rect x="1020" y="790" width="315" height="105" class="agent"/>
  <text x="1178" y="827" text-anchor="middle" class="node-title">Bedrock Knowledge Base</text>
  <text x="1178" y="854" text-anchor="middle" class="node-text">Titan Text Embeddings V2</text>
  <text x="1178" y="878" text-anchor="middle" class="small">5/5 文件已索引＋retrieval 驗證</text>
  <rect x="1380" y="790" width="305" height="105" class="data"/>
  <text x="1533" y="832" text-anchor="middle" class="node-title">S3 Vectors</text>
  <text x="1533" y="860" text-anchor="middle" class="node-text">1024-d COSINE</text>
  <g class="planned">
    <rect x="1020" y="950" width="315" height="90" class="agent"/>
    <text x="1178" y="985" text-anchor="middle" class="node-title">Nova 2 Lite</text>
    <text x="1178" y="1012" text-anchor="middle" class="small">唯一白名單；生成式接線待完成</text>
  </g>
  <rect x="1380" y="950" width="305" height="90" class="security"/>
  <text x="1533" y="985" text-anchor="middle" class="node-title">安全限制</text>
  <text x="1533" y="1012" text-anchor="middle" class="small">低於 1 RPS／最小模型範圍</text>

