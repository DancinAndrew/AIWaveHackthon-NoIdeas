<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AI 生活管家 Flask、AWS 與 Supabase MVP 架構</title>
  <desc id="desc">React 前端經 CloudFront、S3、Identity Provider 與 API Gateway 進入 Flask Lambda。Flask 的 REST、MCP 與 Orchestrator 共用 application services，再連接 Bedrock Runtime、Supabase、S3、Knowledge Bases、OpenSearch 與合作廠商 API。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#5c6670"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7457c8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#111827" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f6f7f9}.title{fill:#172033;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:40px;font-weight:700}.subtitle{fill:#5f6b7a;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:19px}.section{fill:#fff;stroke:#d8dee6;stroke-width:1.5;rx:18;filter:url(#shadow)}.section-title{fill:#232f3e;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:21px;font-weight:700}.rule{stroke:#ff9900;stroke-width:4;stroke-linecap:round}.node{fill:#fff;stroke:#aeb7c2;stroke-width:1.5;rx:13}.client{fill:#f6faff;stroke:#6191d5;stroke-width:1.5;rx:13}.ai{fill:#fbf9ff;stroke:#8f72d8;stroke-width:1.5;rx:13}.data{fill:#f7fcf9;stroke:#55a879;stroke-width:1.5;rx:13}.pending{fill:#fff;stroke:#7a8491;stroke-width:1.5;stroke-dasharray:7 6;rx:13}.node-title{fill:#172033;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:18px;font-weight:700}.node-sub{fill:#5f6b7a;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:14px}.icon-orange{fill:#ff9900;rx:9}.icon-blue{fill:#3d73b9;rx:9}.icon-purple{fill:#7457c8;rx:9}.icon-green{fill:#2f855a;rx:9}.icon-gray{fill:#687382;rx:9}.icon-text{fill:#fff;font-family:Arial,sans-serif;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.flow{fill:none;stroke:#5c6670;stroke-width:2.2;marker-end:url(#arrow)}.flow-ai{fill:none;stroke:#7457c8;stroke-width:2.3;marker-end:url(#arrow-purple)}.dash{fill:none;stroke:#7a8491;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.label-bg{fill:#f6f7f9;rx:5}.label{fill:#596574;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:13px;font-weight:600;text-anchor:middle}.pill{fill:#eee9fb;stroke:#c8bbed;rx:11}.pill-orange{fill:#fff3dc;stroke:#ffc66d;rx:11}.pill-text{fill:#4b3a7b;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.note{fill:#fff8e8;stroke:#ffb547;stroke-width:1.4;rx:13}.note-title{fill:#7a4d00;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:16px;font-weight:700}.note-text{fill:#5c4a2f;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:14px}.legend{fill:#657181;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:13px}
    </style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text class="title" x="70" y="61">AI 生活管家 — Flask + AWS + Supabase MVP 架構</text>
  <text class="subtitle" x="70" y="95">Flask REST 與 MCP 共用 application services；Supabase 是現行交易資料庫</text>

  <rect class="section" x="70" y="135" width="270" height="790"/>
  <rect class="section" x="370" y="135" width="350" height="790"/>
  <rect class="section" x="750" y="135" width="550" height="790"/>
  <rect class="section" x="1330" y="135" width="520" height="790"/>
  <line class="rule" x1="92" y1="174" x2="132" y2="174"/><text class="section-title" x="148" y="181">使用者與外部呼叫者</text>
  <line class="rule" x1="392" y1="174" x2="432" y2="174"/><text class="section-title" x="448" y="181">前端、身分與入口</text>
  <line class="rule" x1="772" y1="174" x2="812" y2="174"/><text class="section-title" x="828" y="181">Flask 應用與 AI</text>
  <line class="rule" x1="1352" y1="174" x2="1392" y2="174"/><text class="section-title" x="1408" y="181">資料、整合與營運</text>

  <!-- Flows behind nodes -->
  <path class="flow" d="M310 270 C345 270 360 250 410 250"/>
  <path class="flow" d="M310 390 C350 390 360 270 410 265"/>
  <path class="flow" d="M565 295 L565 330"/>
  <path class="flow" d="M680 250 C705 250 700 620 680 620"/>
  <path class="dash" d="M565 535 L565 575"/>
  <path class="flow" d="M680 620 L790 350"/>
  <path class="flow" d="M310 555 C420 555 430 635 480 635"/>
  <path class="dash" d="M310 575 C500 760 650 840 790 835"/>
  <path class="dash" d="M790 835 C770 835 730 700 680 650"/>

  <path class="flow-ai" d="M1025 470 L1025 525"/>
  <path class="flow-ai" d="M1025 625 L1025 670"/>
  <path class="flow" d="M1260 320 C1320 320 1300 260 1370 260"/>
  <path class="flow" d="M1260 360 C1320 360 1310 405 1370 405"/>
  <path class="flow" d="M1260 400 C1320 400 1310 665 1370 665"/>
  <path class="flow-ai" d="M1370 405 C1320 405 1320 712 1260 712"/>
  <path class="flow-ai" d="M1260 725 C1320 725 1310 535 1370 535"/>
  <path class="dash" d="M1260 440 C1315 520 1315 790 1370 790"/>
  <path class="dash" d="M1260 455 C1320 610 1320 880 1370 880"/>

  <!-- Labels -->
  <rect class="label-bg" x="330" y="238" width="70" height="24"/><text class="label" x="365" y="255">HTTPS</text>
  <rect class="label-bg" x="578" y="300" width="82" height="24"/><text class="label" x="619" y="317">靜態資源</text>
  <rect class="label-bg" x="620" y="430" width="66" height="24"/><text class="label" x="653" y="447">/api/v1</text>
  <rect class="label-bg" x="578" y="541" width="92" height="24"/><text class="label" x="624" y="558">JWT / actor</text>
  <rect class="label-bg" x="700" y="382" width="92" height="24"/><text class="label" x="746" y="399">REST / MCP</text>
  <rect class="label-bg" x="327" y="529" width="83" height="24"/><text class="label" x="369" y="546">直接 /mcp</text>
  <rect class="label-bg" x="1040" y="482" width="92" height="24"/><text class="label" x="1086" y="499">Prompt loop</text>
  <rect class="label-bg" x="1275" y="235" width="82" height="24"/><text class="label" x="1316" y="252">Repository</text>
  <rect class="label-bg" x="1277" y="638" width="85" height="24"/><text class="label" x="1319" y="655">Vendor API</text>

  <!-- User nodes -->
  <g><rect class="client" x="100" y="220" width="210" height="100"/><rect class="icon-blue" x="120" y="243" width="44" height="44"/><text class="icon-text" x="142" y="266">UI</text><text class="node-title" x="181" y="258">住戶端</text><text class="node-sub" x="181" y="282">React SPA</text><text class="node-sub" x="120" y="306">需求輸入、確認、案件追蹤</text></g>
  <g><rect class="client" x="100" y="340" width="210" height="100"/><rect class="icon-blue" x="120" y="363" width="44" height="44"/><text class="icon-text" x="142" y="386">ADM</text><text class="node-title" x="181" y="378">服務商後台</text><text class="node-sub" x="181" y="402">React SPA</text><text class="node-sub" x="120" y="426">接案、回覆、更新狀態</text></g>
  <g><rect class="client" x="100" y="505" width="210" height="100"/><rect class="icon-blue" x="120" y="528" width="44" height="44"/><text class="icon-text" x="142" y="551">EXT</text><text class="node-title" x="181" y="543">外部 Agent</text><text class="node-sub" x="181" y="567">Lumine One／其他 MCP client</text><text class="node-sub" x="120" y="591">呼叫標準 MCP tools</text></g>
  <g><rect class="note" x="100" y="685" width="210" height="145"/><text class="note-title" x="120" y="718">Accepted 決策</text><text class="note-text" x="120" y="749">• HTTP 後端：Flask</text><text class="note-text" x="120" y="779">• 交易資料：Supabase</text><text class="note-text" x="120" y="809">• 單一 Orchestrator</text></g>

  <!-- Edge nodes -->
  <g><rect class="node" x="410" y="210" width="310" height="85"/><rect class="icon-orange" x="430" y="230" width="44" height="44"/><text class="icon-text" x="452" y="253">CF</text><text class="node-title" x="493" y="245">Amazon CloudFront</text><text class="node-sub" x="493" y="270">HTTPS、快取；AWS WAF 可選</text></g>
  <g><rect class="node" x="410" y="330" width="310" height="75"/><rect class="icon-orange" x="430" y="345" width="44" height="44"/><text class="icon-text" x="452" y="368">S3</text><text class="node-title" x="493" y="359">Amazon S3</text><text class="node-sub" x="493" y="383">React build 靜態檔案</text></g>
  <g><rect class="pending" x="410" y="450" width="310" height="85"/><rect class="icon-gray" x="430" y="470" width="44" height="44"/><text class="icon-text" x="452" y="493">ID</text><text class="node-title" x="493" y="483">Identity Provider（待決）</text><text class="node-sub" x="493" y="509">Amazon Cognito 或 Supabase Auth</text></g>
  <g><rect class="node" x="410" y="575" width="310" height="90"/><rect class="icon-orange" x="430" y="598" width="44" height="44"/><text class="icon-text" x="452" y="621">API</text><text class="node-title" x="493" y="610">Amazon API Gateway</text><text class="node-sub" x="493" y="635">/api/v1 REST + /mcp</text></g>

  <!-- Flask and AI -->
  <g><rect class="node" x="790" y="210" width="470" height="260"/><rect class="icon-orange" x="815" y="235" width="48" height="48"/><text class="icon-text" x="839" y="260">λ</text><text class="node-title" x="884" y="249">AWS Lambda — Flask Application</text><text class="node-sub" x="884" y="275">Lambda Web Adapter 或等價 WSGI adapter</text>
    <rect class="pill-orange" x="815" y="310" width="126" height="30"/><text class="pill-text" x="878" y="326">REST Blueprints</text>
    <rect class="pill-orange" x="950" y="310" width="122" height="30"/><text class="pill-text" x="1011" y="326">MCP Adapter</text>
    <rect class="pill-orange" x="1081" y="310" width="146" height="30"/><text class="pill-text" x="1154" y="326">Orchestrator Adapter</text>
    <text class="node-title" x="815" y="378">Application Services</text><text class="node-sub" x="815" y="404">驗證、授權、confirmation、idempotency、媒合、狀態機</text><text class="node-title" x="815" y="437">Repositories / Vendor Adapters</text><text class="node-sub" x="815" y="459">REST／MCP 共用同一 service layer，內部不經 HTTP loopback</text>
  </g>
  <g><rect class="ai" x="790" y="525" width="470" height="100"/><rect class="icon-purple" x="815" y="551" width="46" height="46"/><text class="icon-text" x="838" y="575">AI</text><text class="node-title" x="883" y="559">Amazon Bedrock Runtime</text><text class="node-sub" x="883" y="585">分類、欄位抽取、追問、工具選擇</text><text class="node-sub" x="883" y="606">套用 Bedrock Guardrails</text></g>
  <g><rect class="ai" x="790" y="670" width="470" height="85"/><rect class="icon-purple" x="815" y="690" width="46" height="46"/><text class="icon-text" x="838" y="714">KB</text><text class="node-title" x="883" y="703">Bedrock Knowledge Bases</text><text class="node-sub" x="883" y="729">只放 FAQ、條款、服務說明與 SOP</text></g>
  <g><rect class="pending" x="790" y="795" width="470" height="90"/><rect class="icon-purple" x="815" y="817" width="46" height="46"/><text class="icon-text" x="838" y="841">MCP</text><text class="node-title" x="883" y="828">AgentCore Gateway（可選）</text><text class="node-sub" x="883" y="854">託管 MCP front door；工具語意維持不變</text></g>

  <!-- Data / external -->
  <g><rect class="data" x="1370" y="210" width="440" height="110"/><rect class="icon-green" x="1392" y="239" width="48" height="48"/><text class="icon-text" x="1416" y="263">DB</text><text class="node-title" x="1462" y="241">Supabase PostgreSQL + RLS</text><text class="node-sub" x="1462" y="268">表單、供應商、案件、媒合與狀態歷程</text><text class="node-sub" x="1462" y="293">actor-scoped access；service role 僅限受控操作</text></g>
  <g><rect class="data" x="1370" y="360" width="440" height="95"/><rect class="icon-green" x="1392" y="384" width="48" height="48"/><text class="icon-text" x="1416" y="408">S3</text><text class="node-title" x="1462" y="394">Amazon S3 — 資料 Bucket</text><text class="node-sub" x="1462" y="420">Knowledge 文件、照片、附件、預簽 URL</text></g>
  <g><rect class="data" x="1370" y="500" width="440" height="85"/><rect class="icon-green" x="1392" y="520" width="48" height="48"/><text class="icon-text" x="1416" y="544">OS</text><text class="node-title" x="1462" y="534">Amazon OpenSearch Serverless</text><text class="node-sub" x="1462" y="560">Knowledge Base 向量索引</text></g>
  <g><rect class="data" x="1370" y="625" width="440" height="85"/><rect class="icon-green" x="1392" y="645" width="48" height="48"/><text class="icon-text" x="1416" y="669">API</text><text class="node-title" x="1462" y="659">合作廠商 API</text><text class="node-sub" x="1462" y="685">時段、庫存、價格、服務狀態</text></g>
  <g><rect class="data" x="1370" y="750" width="440" height="80"/><rect class="icon-green" x="1392" y="768" width="48" height="48"/><text class="icon-text" x="1416" y="792">OBS</text><text class="node-title" x="1462" y="783">Amazon CloudWatch / CloudTrail</text><text class="node-sub" x="1462" y="808">日誌、指標、告警、稽核</text></g>
  <g><rect class="data" x="1370" y="850" width="440" height="65"/><rect class="icon-green" x="1392" y="861" width="48" height="42"/><text class="icon-text" x="1416" y="883">KEY</text><text class="node-title" x="1462" y="878">AWS Secrets Manager + KMS</text><text class="node-sub" x="1462" y="901">Secrets 與個資加密金鑰</text></g>

  <rect class="note" x="70" y="955" width="1780" height="78"/>
  <text class="note-title" x="95" y="985">現行資料決策</text><text class="note-text" x="230" y="985">Supabase PostgreSQL + RLS 是交易資料庫；RDS／Aurora 不在現行實作範圍。</text>
  <text class="note-text" x="230" y="1012">Identity Provider 與 AgentCore Gateway 尚未定案，因此使用虛線標示；Flask、Supabase、Bedrock Runtime 與標準 MCP contract 已定案。</text>
  <line x1="1215" y1="1053" x2="1255" y2="1053" stroke="#5c6670" stroke-width="2.2" marker-end="url(#arrow)"/><text class="legend" x="1265" y="1058">請求／資料流</text>
  <line x1="1400" y1="1053" x2="1440" y2="1053" stroke="#7a8491" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text class="legend" x="1450" y="1058">待決／可選／安全</text>
</svg>
